name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Python unit and local HTTP tests (fictional generated workbooks)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript data logic and owner map
        run: node --test tests/*.test.cjs
