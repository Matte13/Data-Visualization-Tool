name: Tests
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  offline-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt -r requirements-postgres.txt
      - name: Python unit and local HTTP tests (fictional generated workbooks)
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: JavaScript data logic and owner map
        run: node --test tests/*.test.cjs

  postgres-and-container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dvt_test
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: ci-fictional-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U explorer -d dvt_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-postgres.txt
      - name: PostgreSQL persistence and concurrent writers
        env:
          TEST_DATABASE_URL: postgresql://explorer:ci-fictional-password@localhost:5432/dvt_test
        run: python -m unittest discover -s tests -p 'test_postgres_integration.py' -v
      - name: Build runtime image without private workbooks
        run: docker build -t data-visualization-tool:ci .
      - name: Check container dependencies, assets and non-root user
        run: >-
          docker run --rm --entrypoint python data-visualization-tool:ci
          -c "import os,psycopg; from pathlib import Path; assert os.getuid()==10001;
          assert Path('/app/web/owner-map.js').is_file(); assert not list(Path('/app').rglob('*.xlsx'))"

      - name: Start the PostgreSQL deployment package
        env:
          DVT_IMAGE: data-visualization-tool:ci
        run: |
          python scripts/init-env.py
          docker compose -f compose.postgres.yaml up -d --no-build --wait --wait-timeout 120
          curl --fail http://127.0.0.1:8000/api/ready
      - name: Stop disposable CI stack
        if: always()
        run: docker compose -f compose.postgres.yaml down -v
